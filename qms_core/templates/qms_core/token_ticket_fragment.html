{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=302, initial-scale=1">
    <title>Ticket #{{ token.number }}</title>
    <!-- We use inline styles to ensure zero external dependency during print -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap');
        
        @page {
            size: 80mm auto !important;
            margin: 0 !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 80mm;
            min-width: 80mm;
            max-width: 80mm;
            background: white;
            font-family: 'Cairo', sans-serif;
            color: black;
            -webkit-print-color-adjust: exact;
        }

        .ticket-wrapper {
            width: 70mm; /* Leave a small margin for the mechanical cutter */
            margin: 0 auto;
            padding: 10px 0;
            text-align: center;
        }

        .org-name { 
            font-weight: 800; 
            font-size: 1.4rem; 
            margin-bottom: 5px; 
            letter-spacing: 1px;
        }

        .service-title { 
            font-size: 1.2rem; 
            border-bottom: 2px solid black; 
            padding-bottom: 8px; 
            margin-bottom: 15px; 
            font-weight: bold;
        }

        .token-prefix { 
            font-size: 1.8rem; 
            font-weight: bold; 
            margin-bottom: -5px; 
        }

        .token-number { 
            font-size: 6.5rem; 
            font-weight: 900; 
            line-height: 1.1; 
            margin: 0; 
        }

        .ticket-footer { 
            margin-top: 20px; 
            border-top: 1px dashed black; 
            padding-top: 15px; 
        }

        .date { 
            font-size: 1rem; 
            font-weight: bold;
            margin-bottom: 5px; 
        }

        .msg { 
            font-size: 0.9rem; 
            margin-bottom: 10px;
        }

        .barcode { 
            font-size: 1.5rem; 
            letter-spacing: 2px;
            font-family: monospace;
            opacity: 0.8;
            margin-top: 10px;
        }

        @media screen {
            body { padding: 20px; background: #eee; display: flex; justify-content: center; }
            .ticket-wrapper { background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); padding: 20px; border-radius: 5px; }
        }
    </style>
</head>
<body onload="handlePrint()">
    <div class="ticket-wrapper">
        <div class="ticket-header">
            <h2 class="org-name">QMS SYSTEM</h2>
            <p class="service-title">{{ token.service.name }}</p>
        </div>
        
        <div class="ticket-body">
            <div class="token-prefix">{{ token.service.prefix }}</div>
            <div class="token-number">{{ token.number }}</div>
        </div>
        
        <div class="ticket-footer">
            <div class="date">{{ token.created_at|date:"d/m/Y H:i" }}</div>
            <div class="msg">{% trans "Thank you for waiting" %}</div>
            <div class="barcode">|||| || |||| ||| ||</div>
        </div>
    </div>

    <script>
        function handlePrint() {
            let printed = false;
            
            // Function to trigger print and signal parent
            const trigger = () => {
                if (printed) return;
                printed = true;
                window.focus();
                
                // Trigger reset when the print dialog is closed
                window.onafterprint = () => {
                    if (window.parent && window.parent.onTicketPrinted) {
                        window.parent.onTicketPrinted();
                    }
                };

                window.print();
            };

            // Priority 1: Wait for fonts (Best layout)
            if (document.fonts) {
                document.fonts.ready.then(() => {
                    setTimeout(trigger, 200);
                });
            }

            // Priority 2: Safety Fallback (Print anyway after 1.5s even if fonts/metrics hang)
            setTimeout(trigger, 1500);
        }
    </script>
</body>
</html>
