{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Your Ticket" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Cairo', sans-serif; }
        .ticket-card {
            width: 320px;
            background: white;
            border: 2px dashed #000;
            margin: 20px auto;
            padding: 1.5rem;
            text-align: center;
            position: relative;
        }
        .prefix-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #666;
            border: 1px solid #ddd;
            padding: 2px 10px;
            border-radius: 5px;
        }
        .ticket-number {
            font-size: 7rem;
            font-weight: 800;
            margin: 0.5rem 0;
            line-height: 1;
        }
        .service-name {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 1rem;
        }
        @page { size: 80mm 80mm; margin: 0; }
        @media print {
            .no-print { display: none; }
            html, body { width: 80mm; margin: 0; padding: 0; background: white; }
            .ticket-card {
                box-sizing: border-box;
                width: 72mm;
                border: 0;
                margin: 0 auto;
                padding: 2mm 0 1mm;
            }
            .ticket-number { font-size: 5rem; margin: 0.1rem 0; }
            .ticket-card hr { margin: 0.25rem 0; }
            .ticket-card p { margin-bottom: 0.1rem; }
            .service-name { margin-bottom: 0.5rem; }
        }
    </style>
</head>
<body onload="setTimeout(() => window.print(), 300)">
    <div class="ticket-card">
        <div class="prefix-badge">{{ token.service.prefix }}</div>
        <div class="service-name">{{ token.service.name }}</div>
        <hr>
        <div class="text-uppercase small">{% trans "Your Ticket Number" %}</div>
        <div class="ticket-number">{{ token.number }}</div>
        <hr>
        <p class="small text-muted">{% trans "Date" %}: {{ token.created_at|date:"d-m-Y H:i" }}</p>
        <p class="small">{% trans "Thank you for waiting" %}</p>
        
        <div class="no-print mt-4">
            <button onclick="window.print()" class="btn btn-primary btn-lg">{% trans "Print Again" %}</button>
            <br><br>
            <a href="{% url 'qms_core:kiosk' %}" class="btn btn-link">{% trans "Back to Kiosk" %}</a>
        </div>
    </div>
</body>
</html>
