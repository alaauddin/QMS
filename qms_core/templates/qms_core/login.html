{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "QMS Operator Login" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: {{ system_config.primary_color|default:"#1a237e" }};
            --secondary: {{ system_config.secondary_color|default:"#311b92" }};
            --accent: {{ system_config.accent_color|default:"#ffffff" }};
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            background: white;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            position: relative;
            z-index: 10;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-header h1 {
            color: var(--primary);
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .form-control {
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(57, 73, 171, 0.1);
        }
        .btn-login {
            background: var(--primary);
            color: white;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 1rem;
            transition: all 0.3s;
            border: none;
        }
        .btn-login:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            color: white;
        }
        .auth-bg-shapes div {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            z-index: 1;
        }
        .shape-1 { width: 300px; height: 300px; top: -100px; right: -100px; }
        .shape-2 { width: 200px; height: 200px; bottom: -50px; left: -50px; }
    </style>
</head>
<body>
    <div class="auth-bg-shapes">
        <div class="shape-1"></div>
        <div class="shape-2"></div>
    </div>

    <div class="login-card">
        <div class="login-header">
            <h1>{% trans "Login" %}</h1>
            <p class="text-muted">{% trans "Standard Queue Management" %}</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <input type="text" name="username" class="form-control" placeholder="{% trans 'Username' %}" required autofocus>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control" placeholder="{% trans 'Password' %}" required>
            </div>
            
            {% if form.errors %}
            <div class="alert alert-danger py-2 mb-4 fs-6">
                {% trans "The username or password you entered is incorrect." %}
            </div>
            {% endif %}

            <div class="d-grid">
                <button type="submit" class="btn btn-login">
                    {% trans "Sign In" %}
                </button>
            </div>
        </form>
    </div>
</body>
</html>
